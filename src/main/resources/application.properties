# Server Configuration
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
# Uses environment variables with sensible local defaults, avoiding hardcoded passwords
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:login_monitor}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Suspicious Activity Detection Properties (from Architecture Plan)
app.detection.window-minutes=10
app.detection.ip-failure-threshold=5
app.detection.user-failure-threshold=5
app.detection.unusual-success-failure-threshold=3
app.detection.scan-interval-seconds=60

# Session Management Configuration (Phase 2.2)
app.session.timeout-minutes=15
app.session.cleanup-interval-seconds=60

# Rate Limiting Configuration (Phase 2.2)
app.rate-limit.max-attempts=5
app.rate-limit.window-seconds=60

# Email Alerts Configuration (Phase 3.1)
# Supports both APP_ALERTS_* / SPRING_MAIL_* naming and legacy aliases
app.alerts.email.enabled=${APP_ALERTS_EMAIL_ENABLED:${EMAIL_ALERTS_ENABLED:false}}
app.alerts.email.admin-recipient=${APP_ALERTS_EMAIL_TO:${EMAIL_ALERT_RECIPIENT:}}
app.alerts.email.from=${MAIL_FROM:noreply@innspark.com}
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CAPTCHA Configuration (Phase 3.1)
# Supports both APP_CAPTCHA_* naming and legacy aliases
app.captcha.enabled=${APP_CAPTCHA_ENABLED:${CAPTCHA_ENABLED:false}}
app.captcha.secret=${APP_CAPTCHA_SECRET:${CAPTCHA_SECRET:}}
app.captcha.verify-url=${APP_CAPTCHA_VERIFY_URL:${CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}}
app.captcha.score-threshold=${APP_CAPTCHA_SCORE_THRESHOLD:${CAPTCHA_SCORE_THRESHOLD:0.5}}
app.captcha.failure-threshold=${APP_CAPTCHA_FAILURE_THRESHOLD:3}

# Multi-Factor Authentication (OTP / 2FA) Configuration (Phase 3.2)
app.otp.enabled=${APP_OTP_ENABLED:true}
app.otp.expiration-minutes=${APP_OTP_EXPIRATION_MINUTES:5}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-resends=${APP_OTP_MAX_RESENDS:3}
